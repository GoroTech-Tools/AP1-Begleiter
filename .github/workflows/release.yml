name: Build and release AP1-Begleiter

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Create build virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r src/requirements.txt

      - name: Update version references and documentation
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $tagEvent = $env:RELEASE_REF -like 'refs/tags/*'
          if ($tagEvent) {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Ungültiger Release-Tag: $tag"
            }
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            $versionTuple = "$($Matches[1]), $($Matches[2]), $($Matches[3]), 0"
          }
          else {
            $currentTag = (Get-Content src/version_info.txt -Raw).Trim()
            if ($currentTag -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') {
              throw "Ungültige Version in src/version_info.txt: $currentTag"
            }
            $latestVersion = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
            foreach ($existingTag in (git tag --list 'v[0-9]*')) {
              if ($existingTag -match '^v(\d+)\.(\d+)\.(\d+)$') {
                $tagVersion = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
                if ($tagVersion -gt $latestVersion) {
                  $latestVersion = $tagVersion
                }
              }
            }
            if ($env:EVENT_NAME -ne 'pull_request') {
              $latestVersion = [version]::new($latestVersion.Major, $latestVersion.Minor, $latestVersion.Build + 1)
            }
            $version = $latestVersion.ToString()
            $versionTuple = "$($latestVersion.Major), $($latestVersion.Minor), $($latestVersion.Build), 0"
            $tag = "v$version"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          $version = $tag.Substring(1)
          $versionTuple = "$($version.Split('.')[0]), $($version.Split('.')[1]), $($version.Split('.')[2]), 0"

          Set-Content src/version_info.txt $tag -Encoding utf8NoBOM

          $metadata = Get-Content src/build_version_info.txt -Raw
          $metadata = $metadata -replace 'filevers=\([^)]+\)', "filevers=($versionTuple)"
          $metadata = $metadata -replace 'prodvers=\([^)]+\)', "prodvers=($versionTuple)"
          $metadata = $metadata -replace "StringStruct\('FileVersion', '[^']+'\)", "StringStruct('FileVersion', '$version')"
          $metadata = $metadata -replace "StringStruct\('ProductVersion', '[^']+'\)", "StringStruct('ProductVersion', '$version')"
          Set-Content src/build_version_info.txt $metadata -Encoding utf8NoBOM

          $readme = Get-Content README.md -Raw
          $readme = $readme -replace '(?m)^Version: `v\d+\.\d+\.\d+`$', "Version: ``$tag``"
          Set-Content README.md $readme -Encoding utf8NoBOM

          $technicalDocs = Get-Content docs/DOKUMENTATION_TECHNIK.md -Raw
          $technicalDocs = $technicalDocs -replace '(?m)^- Aktueller Stand: `v\d+\.\d+\.\d+`\.$', "- Aktueller Stand: ``$tag``."
          Set-Content docs/DOKUMENTATION_TECHNIK.md $technicalDocs -Encoding utf8NoBOM

          $main = Get-Content src/main.py -Raw
          $main = $main -replace 'DEFAULT_APP_VERSION = "v\d+\.\d+\.\d+"', "DEFAULT_APP_VERSION = `"$tag`""
          Set-Content src/main.py $main -Encoding utf8NoBOM

          $launcher = Get-Content src/AP1-Begleiter-Portable-starten.ps1 -Raw
          $launcher = $launcher -replace '\$script:AppVersion = "v\d+\.\d+\.\d+"', "`$script:AppVersion = `"$tag`""
          Set-Content src/AP1-Begleiter-Portable-starten.ps1 $launcher -Encoding utf8NoBOM

          $releaseNotesPath = "release/RELEASE_NOTES_$tag.md"
          if ($tagEvent) {
            if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
              throw "Release Notes nicht gefunden: $releaseNotesPath"
            }
            $releaseNotes = Get-Content $releaseNotesPath -Raw
            $downloadSection = @"
          ## Download

          - [Release-Seite $tag](https://github.com/GoroTech-Tools/AP1-Begleiter/releases/tag/$tag)
          - [ZIP direkt herunterladen](https://github.com/GoroTech-Tools/AP1-Begleiter/releases/download/$tag/AP1-Begleiter-Portable_$tag.zip)
          "@
            if ($releaseNotes -match '(?m)^## Download\s*$') {
              $releaseNotes = [regex]::Replace($releaseNotes, '(?ms)^## Download\r?\n.*?(?=^## |\z)', "$downloadSection`n`n")
            }
            else {
              $title = [regex]::Match($releaseNotes, '(?m)^# .+$')
              if (-not $title.Success) {
                throw "Release Notes enthalten keine Markdown-Überschrift: $releaseNotesPath"
              }
              $remainingNotes = $releaseNotes.Substring($title.Index + $title.Length).TrimStart("`r", "`n")
              $releaseNotes = $releaseNotes.Substring(0, $title.Index + $title.Length) + "`n`n$downloadSection`n`n" + $remainingNotes
            }
            Set-Content $releaseNotesPath $releaseNotes.TrimEnd() -Encoding utf8NoBOM
          }

          if ($env:RELEASE_REF -eq 'refs/heads/main' -or $tagEvent) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md docs/DOKUMENTATION_TECHNIK.md src/version_info.txt src/build_version_info.txt src/main.py src/AP1-Begleiter-Portable-starten.ps1
            if ($tagEvent) {
              git add $releaseNotesPath
            }
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Update documentation for $tag"
              if ($LASTEXITCODE -ne 0) { throw "Dokumentations-Commit fehlgeschlagen." }
              git push origin HEAD:main
              if ($LASTEXITCODE -ne 0) { throw "Dokumentations-Push nach main fehlgeschlagen." }
            }
          }

      - name: Build release package
        shell: pwsh
        run: .\src\build.ps1

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release/AP1-Begleiter-Portable_${{ steps.version.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ github.sha }}
          path: release/RELEASE_NOTES_${{ steps.version.outputs.tag }}.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Download release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ github.sha }}
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: AP1-Begleiter ${{ needs.build.outputs.tag }}
          files: release/AP1-Begleiter-Portable_${{ needs.build.outputs.tag }}.zip
          fail_on_unmatched_files: true
          body_path: ${{ startsWith(github.ref, 'refs/tags/v') && format('release/RELEASE_NOTES_{0}.md', needs.build.outputs.tag) || '' }}
          generate_release_notes: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: true
          overwrite_files: true
